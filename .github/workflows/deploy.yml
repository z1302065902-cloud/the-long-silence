name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 注入爱发电订单自助解锁的验证端点（Vercel）到前端 bundle。
      # 该变量为 public，无敏感信息；不设则前端回退到相对路径 /api/afdian-verify。
      - run: npm run build
        env:
          VITE_AFDIAN_VERIFY_URL: https://the-long-silence-seven.vercel.app/api/afdian-verify
      # itch.io 完整版构建：直接解锁，部署到 /the-long-silence/itch/ 子路径
      - run: npx vite build --base=/the-long-silence/itch/ --outDir=dist-itch
        env:
          VITE_FULL_VERSION: '1'
      - run: mkdir -p dist/itch && cp -r dist-itch/* dist/itch/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
